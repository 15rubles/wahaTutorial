spring:
  application:
    name: muster
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/muster}
    username: ${DB_USER:muster}
    password: ${DB_PASSWORD:muster}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false
  session:
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
    timeout: 14d
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB
  jackson:
    default-property-inclusion: non_absent

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 14d
      cookie:
        name: MUSTER_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax

muster:
  auth:
    max-failed-logins: 10
    lock-duration: 15m
    invite-default-validity: 7d
    cookie-secure: ${COOKIE_SECURE:true}
    admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}
      email: ${ADMIN_EMAIL:}
