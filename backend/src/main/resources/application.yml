spring:
  application:
    name: muster
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/muster}
    username: ${DB_USER:muster}
    password: ${DB_PASSWORD:muster}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
