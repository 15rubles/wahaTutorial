name: muster

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-muster}
      POSTGRES_USER: ${POSTGRES_USER:-muster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muster}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-muster}
      DB_USER: ${POSTGRES_USER:-muster}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-muster}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DATA_SOURCES_DIR: /app/data-sources
    volumes:
      # Raw import files and the Wahapedia cache (gitignored, never committed).
      - ../data-sources:/app/data-sources
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8088}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
